body:
  text: 通鑑胡注舉正跋胡氏音注通鑑其始未詳於自序中按元袁伯長記其父洪之師友作師友淵源録胡氏乃伯長先友之一也稱其客賈相家釋通鑑三十年兵難稿三失乙酉嵗留袁氏熟手抄定注今胡序云乙酉徹編正與袁記語合又序末云書扵梅蠖居盖即袁氏熟舍也表記復云己丑冦作以書藏窖中得免則斯注流𫝊於後者亦幸耳東吴陳景雲
