body:
  text: 通鑑胡注舉正編年類提要臣等謹案通鑑胡注舉正一巻國朝陳景雲撰景雲字少章常熟人寄籍為吳江縣學生是書舉正胡三省通鑑音註之誤凡六十三條而所正地理居多頗為精核然如周赧王五十七年大梁夷門監者註以夷門為大梁北門不知史記信陵君𫝊本作東門又隋煬帝大業元年奇章公牛宏註但引隋書新唐書作其章縣不知舊唐書本作奇章謂以縣東八里奇章山得名又漢明帝永平十四年隧鄉名見漢書地理志泰山郡虵邱縣條下唐高祖武徳三年溱州見隋書煬帝紀大業元年及地理志汝南郡條下後晉高祖天福四年康化軍見陸㳺南唐書烈祖本紀而註皆云無考凡斯之類尚未悉舉考書後附載王峻所作景雲墓誌稱作通鑑胡註舉正十巻而巻末其子黄中跋亦稱書本十巻屋漏鼠齧之餘僅存什一然則是編乃殘缺之稿其多所挂漏宜矣要此所存諸條亦未始不足資考據也乾隆四十六年十一月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:c233cbed7523d73b9b52a152194b4d895c68dd820a0e167e3610b2ad1f585649
