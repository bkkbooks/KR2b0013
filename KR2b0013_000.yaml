body:
  text: 通鑑胡注舉正編年類提要臣等謹案通鑑胡注舉正一卷國朝陳景雲撰景雲字少章常熟人寄籍為吳江縣學生是書舉正胡三省通鑑音注之誤凡六十三條而所正地理居多頗為精核然如周赧王五十七年大梁夷門監者注以夷門為大梁北門不知史記信陵君傳本作東門又隋煬帝大業元年奇章公牛宏注但引隋書新唐書作其章縣不知舊唐書本作奇章謂以縣東八里奇章山得名又漢明帝永平十四年隧鄉名見漢書地理志泰山郡蛇邱縣條下唐高祖武德三年溱州見隋書煬帝紀大業元年及地理志汝南郡條下後晉高祖天福四年康化軍見陸遊南唐書烈祖本紀而注皆云無考凡斯之類尚未悉舉考書後附載王峻所作景雲墓志稱作通鑑胡注舉正十卷而卷末其子黃中跋亦稱書本十卷屋漏鼠齧之餘僅存什一然則是編乃殘缺之稿其多所挂漏宜矣要此所存諸條亦未始不足資考據也乾隆四十六年十一月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:bc13456a46db06303afe8817c3d24c18983d2170ec318058fd489de4ba3cf7e9
