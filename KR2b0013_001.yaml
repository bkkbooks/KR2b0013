body:
  text: 通鑑胡注舉正常熟陳景雲撰史記田橫入海居島中張守節正義曰海州東海縣有島山去岸八十里杜佑通典云海州東海縣田橫所保鬱洲亦曰郁洲漢贛榆縣是唐人皆以橫所居海島在海州胡氏注既引史記正義之文又曰北史楊愔避讒東入田橫島是島以橫居之得名且并以愔亦嘗匿此地矣按北齊書及北史皆云愔潛之光州東入田橫島齊神武令光州刺史搜訪以禮發遣光州隋改東萊郡隋志云東萊郡即墨縣有田橫島是愔匿即墨海島史文明甚至海州之地此時方南屬蕭梁愔不得越境至此合齊書北史及隋志考之則田橫所居海島自當以三史為是劉玄建元更始更字前後兩漢書注皆不音蓋讀本字與劉更生之更同按禮月令嵗且更始陸氏釋文無音則知當作如字陳氏集説及胡注並音平聲者非諸葛武侯後出師表此臣之未解一也未解猶言未曉胡注解讀曰懈言未敢懈怠非也續漢志揚州刺史治九江歷陽而九江屬邑壽春下劉昭注引漢官云刺史治二説互異胡注言本治歷陽後移壽春未詳何據通典復云自壽春移歷陽其説又不同晉成帝咸和三年陶侃諸軍討蘇峻既築白石壘又立大業曲阿庱亭三壘以分兵勢注引丁度曰庱亭在吳興按通典云白石壘在城西蓋即白下也張敦頤六朝事迹白下本江乘之白石壘也齊武帝以其地帶江山移琅邪居之則大業三壘必亦與臺城相距不逺故更屯軍其地以分賊勢何事逺築壘於東偏之吳興乎又唐武德三年李子通渡江攻沈發興取京口法興遣兵拒戰於庱亭胡注以庱亭在毗陵西北此注是吳志孫權將如吳射虎庱亭蓋庱亭乃自秣陵至吳所經地元和郡縣志庱亭在丹陽縣東四十里此其證也廣韻庱字平上二聲並收平聲注庱亭在吳興上聲注庱亭在晉陵蓋本有二地胡氏蓋失之細考耳哀帝興平元年涼張天錫遣司馬綸騫奉章注綸姓譜曰魏志孫文端臣綸直按文端當作公孫文懿即公孫淵也唐人撰姓譜因避髙祖廟諱故舉其字晉書宣帝紀可證文懿臣綸直亦見宣紀而魏志無之所引書名亦誤孝武太元十四年徐邈與范寧書足下慎選綱紀必得國士以攝諸曹按綱紀乃主簿之職見李善文選注蓋主簿即攝諸曹事者故邈欲寧愼其選耳今注云郡以僚佐為綱紀不明悉矣安帝元興三年桓玄曰禮太祖東向左昭右穆注昭本如字為漢諱昭改音韶按漢代諱昭未見所出漢當作晉昭本如字唐李涪語又見陳髙祖永定元年周立五廟注義熙元年盧循遺劉裕益智粽注蜜煮為粽又云粽角黍也按以後宋廢帝殺江夏王義恭以蜜漬目睛謂之鬼目粽事互證則前解為長九年五月乙亥魏王嗣如雲中乙卯遣劉潔屯西河注乙亥丙子幾四十日五月無乙卯恐是己卯按丙子乃乙卯之誤十一年夏赫連建擊秦入新平廣平公弼與戰於龍尾堡禽之注劉昫地理志鳯翔府岐山縣唐武德七年移治龍尾城按夏秦搆兵戰於新平則龍尾堡即新平境內地新平在唐為邠州與鳯翔岐山之龍尾城不相涉也宋文帝元嘉十三年殺檀道濟并其子植等十一人誅之惟宥其孫孺注惟宥諸孫之在童孺者按宋書孺乃道濟少子雍之子蓋盡誅諸子惟宥一孫元嘉十七年敕西州道上不得有車聲注宋白曰漢武帝元封二年改鄣郡為丹陽郡置揚州刺史理秣陵西州稿冶城之間是其理處劉繇為揚州刺史始移理曲阿孫䇿號此為西州按漢揚州刺史理壽春晉武平吳始移秣陵非漢武也劉繇刺揚州在後漢獻帝初時壽春已為袁術所據故渡江駐曲阿非自秣陵移理也又為西州之號始於孫䇿於史亦無所見續漢志揚州刺史治九江歷陽而九江屬邑壽春下劉昭引漢官云刺史治胡注又言本治歷陽後移壽春與此處所引異通典云自壽春移歷陽元嘉二十二年禍流儲宰注蓋欲併殺太子劭按儲謂太子宰謂太宰司徒江夏王義恭注遺其一元嘉二十九年魯秀魯爽程天祚出許洛注引魯爽傳天祚為魏所獲是年與爽秀俱來奔按通鑑上文天祚先自魏逃歸爽秀降宋在後非偕行者注所引與前注戾孝武孝建二年魏宗愛召百官於都坐又大明八年蔡興宗於都坐語顔師伯兩都坐俱有注按之則後注是也宜刪前注以後條易之明帝泰始元年誅江夏世子伯禽注義恭命其世子伯禽是以周公自處按伯禽之名乃孝武所命事見宋書注非車駕屢幸貴第按貴第即指慶之之第觀下文自明注謂時貴之第非泰始七年百姓賣兒貼婦注有兩解後解是又唐律不許典貼良人男女作奴婢驅使蓋典猶質也貼即賣矣齊髙帝建元二年上湯殺囚注因時有囚行瘟疫宜汗遂上湯以蒸殺之其解似誤當考武帝永明二年為禁司所覺投之江水注禁司主防禁諸王者按注非也齊武猜忌諸王設置防禁事據通典云齊朝時建康西有石頭津東有方山津各置津主賊曺直水諸貟以檢察禁物此則所謂禁司也時武陵王晃自南徐還建康其私載兵仗為禁司所覺蓋舟過方山津而津吏發其事也兩眼刺史尚不敢調我況一眼乎按陳顯達與桂陽王休範兵戰於杜姥宅飛矢貫目事見廢帝元徽二年注未之及永明三年巾卷在庭注云巨貟翻武冠也鄭注禮記云武冠卷也按注音釋俱誤卷當作如字讀宋顔延年皇太子釋奠國學詩云巾卷充街按晉制國子生見祭酒博士單衣角巾執巾一卷故曰巾卷李善注顔詩云巾箱也所以盛書亦非永明十一年板王融寧朔將軍按板字注有兩解或説是難可輕􅗓衣裾注􅗓義與敝同按注説甚晦後漢趙岐娶馬融兄女而鄙融嘗與友書曰馬季長不持士節三輔髙士未嘗以衣裾􅗓其門徐勉語殆本此又史記騶衍適趙平原君側行襒席索隱云襒拂也音匹結反􅗓與襒同明帝建武四年王晏外弟阮孝緒注外弟妻弟按外弟乃姑子注非永泰元年王瞻宏之從孫注王宏之以仕晉宋武帝辟召無所就按瞻乃宏從孫宏之之族二王俱有傳見南史瞻附宏傳後和帝中興元年須來至白門前當之一決注白門建康西門西方色白改以為稱按建康外城十二門無白門蓋謂白下門耳白下在新亭東猶東府城之稱東城也齊永明中移琅邪城於此為屯軍要地是冬梁武兵逼建康新亭及琅琊城主相繼降附而都城受圍是明證也注非梁武天監四年冦城侵淫注侵淫以癰疽為喻侵毒好肉為淫按侵淫猶浸淫也見漢書司馬相如傳顔注猶漸漬中大通元年袁昂為吳郡不降按吳郡當作吳興注未舉正太清元年諸將言侯景之叛由崔暹注崔暹劾權貴諸將恨之故以景叛為暹罪按注説猶有未盡暹為中尉嘗劾侯景諸將既素憾暹故因景叛欲以激變罪之杜弼檄蕩舟稱力注引左傳齊桓公與蔡姬乘舟於囿蕩公事非也論語奡蕩舟孔安國曰奡多力能陸地行舟簡文大寶元年齊立世宗妃元氏為文襄皇后注后東魏孝靜帝女按后乃孝靜妹非女也衡陽王獻暢之孫注暢武帝之孫按暢乃武帝弟非孫也敬帝太平元年齊兵出柵口注宋白曰廬州東南至柵口今謂之新婦口三百八十四里按三百八十四里六字當在至柵口下下卷王琳至柵口注可互證陳霸先拒徐嗣徽於白城按白城即白下城與東府城稱東城同陳髙祖永定元年余孝頃出自豫章據石頭注引汪藻説豫章西石頭渚即殷浩投書處按世説殷洪喬作豫章臨去都下人因附百許亟書既至石頭悉擲水中蓋都下人緣殷赴郡附書而殷甫出都過石頭城即投之江水非豫章石頭渚也汪説誤石頭城在建康西乃赴豫章孔道至石頭渚在豫章西如既至石頭則業已越郡境不當更有投書事矣宣帝大建五年國家待遇淮南失之同於蒿箭注引唐髙祖語按魏文帝以孟達為新城太守羣臣多以為非宜帝曰譬以蒿箭射蒿中耳此唐髙祖語所本也注當引之六月齊主遊南苑從臣賜死者六十人注史言齊主淫刑以逞按北齊書賜當作暍蓋從官多以觸熱驟斃賜乃字誤耳注未及正而誤解綱目亦仍通鑑訛本之誤周密齊東野語中已辨之終遘萇宏之眚謂王琳不識天命自取違天之禍也注泛引萇宏事失其旨矣大建八年王軌驟言於帝注不從容而言之謂驟按驟猶數也與左傳趙宣子驟諫之驟同注非大建十一年事由烏丸軌宇文孝伯因言軌捋鬚事注孝伯何為出此言欲以求免然終不免按宇文孝伯四字當屬上讀因言者即鄭譯之言也注者誤斷其句遂作此解蓋仍胡氏讀史管見之踈周使伊婁謙與元衛聘齊考異曰謙傳作拓跋偉今從周書帝紀注伊婁與拓跋同所自出則伊婁謙本傳作拓跋不為無據按考異自言拓跋偉與元衛傳紀不同非謂伊婁拓跋之異也注誤長城公至德二年張貴妃生太子深按後禎明二年廢太子胤始立始安王為皇太子於時未也太子當作始安王注未舉正隋文帝開皇十年越州髙智慧反注會稽郡梁置東揚州陳改吳州平陳改吳州後改越州按平陳下衍改吳州三字開皇十七年虞慶則還至潭州臨桂嶺注慶則傳作潭州按兩潭字有一誤仁壽四年畜生何足付大事注今人詈人猶曰畜生言其無識無禮若馬牛犬豕然特畜養而生按畜生猶畜産也畜産見後漢書劉寬傳蓋言六畜所生也則以此詈人其來久矣注非煬帝大業六年初帝欲營汾陽宫考異曰張衡傳云帝幸衡宅之明年幸汾陽宫又云明年又幸汾陽宫本紀皆無其事疑傳誤按幸衡宅之明年大業四年也是年四月始詔營汾陽宫而齊王暕以從幸汾陽得罪即此月也似與衡傳合然詔營之後宫成帝幸不出三旬恐無是理則暕傳亦誤溫公前採暕傳偶未擲其誤注者亦未能舉正也大業九年今段何如注今段言自今以後一段事按今段猶言今此六朝人常語觀晉以後史可見注非恭帝義寧元年六月己卯李建成等至晉陽乙巳郗士陵降己巳康鞘利北還按考異是年七月己酉朔則己卯乃六月朔也乙巳二十七日與己酉相去止五日其中無己巳此定有誤注未之及唐髙祖武德元年蕭巨琮之弟子按此語已見前大業六年此重出注未之及李密送所獲郎將于洪建皇泰主命戮於左掖門外如斛斯政之法按于洪建疑即于洪達洪達縊煬帝見考異所引蒲山公傳及河洛記皇泰主加以慘戮蓋正其弒逆之罪也但建達互異當有一誤又是年宇文化及謀逆同黨中有孟秉及明年竇建德擒化及斬逆黨孟景等其名亦前後不同蓋景即秉字因避廟諱嫌名易之如以蒿箭射蒿中耳注當引魏文帝語已見前武德二年行軍總管假德操擊敗梁師都兵德操孝先之子注假孝先柄用於髙齊之季按孝先名韶當書名注未舉正武德七年合瞑抱之趨出注人睡則目合而瞑按合瞑疑會暝之誤會暝蒙上向夕言之謂日光已晦也注誤解又見後一百九十七卷契苾何力破髙麗兵追奔數十里會瞑而罷是也武德九年達官皆來謁我注突􅍏言達官猶中國言顯官按突厥中無達官之稱帝以中國語指其貴臣耳太宗貞觀十年恪為吳王注自此以上皆皇弟也按此注當在上魏王靈夔為燕王下正由宇文述虞世基裴藴內為諂諛外蔽聰明故也注煬帝大業三年令宇文愷作洛陽西苑述恐當作愷按愷在當時止董營繕之事未嘗關預朝政其為諂蔽聰明速隋之亡皆述與虞裴之罪耳作述為是貞觀二十年流殃搆禍乃自運初注言戎狄之流殃搆禍乃自唐興運之初按運初即蒙上與天地俱生二語言之下文云混元以降即謂運初以來也注誤解貞觀二十一年命修終南山太和廢宫為翠微宫注楊大年曰翠微宫在驪山絶頂按史明言修終南山之宫而云在驪山絶頂非也注未辨其誤而採之髙宗永徽四年睦州女子陳碩真注吳孫權分丹陽立新安郡按新安當作新都至晉太康初新安始立郡總章二年以張文瓘為東臺侍郎考異曰陳紀在乾封二年注陳字必誤按陳乃新字之訛天后垂拱四年堂邑人董玄寂注堂邑漢縣按博州之堂邑隋代始置非漢縣也漢之堂邑乃今之六合耳此承後漢書注及通典之誤先子嘗言胡身之注通鑑於地理最有功而惜其尚有踈舛每歎注書之難因成舉正十卷手稿屢經改竄黃中頻嵗負米逺遊未録副本戊辰秋居廬之暇收拾遺書獨此編得於屋漏鼠嚙之餘紙墨漫漶殆不可辨補綴零落僅存什一藏弆不謹罪戾實大視能讀父書者獨何人哉甲戌夏日男黃中謹識通鑑胡注舉正
